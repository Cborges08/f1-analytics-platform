
services:
  postgres:
    image: postgres:16-alpine
    container_name: f1_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build: ./pipeline
    container_name: f1_pipeline
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pipeline:/app

  api:
    build: ./api
    container_name: f1_api
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: f1_frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: